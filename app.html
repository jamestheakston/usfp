<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="USFP app — plan overseas Scout camps.">
  <title>App — USFP</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

    :root {
      --ink: #132d2b;
      --ink-soft: #48635e;
      --cream: #f6f7f1;
      --paper: #fffefa;
      --mint: #d7eee1;
      --green: #23845c;
      --green-dark: #176345;
      --orange: #f3a05d;
      --yellow: #f7d88a;
      --blue: #a7dce0;
      --line: rgba(19, 45, 43, 0.13);
      --shadow: 0 24px 70px rgba(17, 56, 48, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 4%, rgba(167, 220, 224, 0.6), transparent 25rem),
        radial-gradient(circle at -5% 34%, rgba(247, 216, 138, 0.28), transparent 24rem),
        var(--cream);
      font-family: "DM Sans", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 25px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      color: var(--paper);
      background: var(--ink);
      border-radius: 11px 11px 11px 3px;
    }
    .brand-mark svg { width: 16px; height: 16px; }

    .topbar-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--ink-soft); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button-primary { color: var(--paper); background: var(--green); box-shadow: 0 10px 24px rgba(35, 132, 92, 0.2); }
    .button-primary:hover { background: var(--green-dark); }
    .button-quiet { color: var(--ink); background: transparent; padding-left: 0; padding-right: 0; }
    .button-quiet:hover { color: var(--green); }
    .button svg { width: 15px; height: 15px; }

    main { width: min(960px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 80px; }

    .panel {
      max-width: 520px;
      margin: 60px auto;
      padding: 38px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      letter-spacing: -0.05em;
      line-height: 1.1;
    }
    .panel > p { margin: 0 0 26px; color: var(--ink-soft); font-size: 14px; }

    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .role-card {
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .role-card:hover { transform: translateY(-3px); border-color: var(--green); background: var(--mint); }
    .role-card svg { width: 30px; height: 30px; color: var(--green-dark); }
    .role-card strong { font-family: "Space Grotesk", sans-serif; font-size: 17px; letter-spacing: -0.03em; }
    .role-card span { color: var(--ink-soft); font-size: 12px; }

    .hidden { display: none; }

    .dash-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 40px 0 26px; }
    .dash-head h1 { margin: 0; font-size: clamp(30px, 4vw, 42px); }
    .dash-head p { margin: 8px 0 0; color: var(--ink-soft); font-size: 14px; }

    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .stat {
      padding: 22px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .stat strong { display: block; margin-bottom: 6px; font-family: "Space Grotesk", sans-serif; font-size: 26px; letter-spacing: -0.04em; }
    .stat span { color: var(--ink-soft); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      padding: 13px 17px;
      color: var(--paper);
      background: var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: 180ms ease;
      pointer-events: none;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 680px) {
      .topbar, main { width: min(100% - 32px, 540px); }
      .panel { margin: 30px auto; padding: 28px 22px; }
      .role-grid, .stat-grid { grid-template-columns: 1fr; }
      .dash-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><i data-lucide="tent"></i></span>
      USFP
    </a>
    <div class="topbar-right">
      <span id="userEmail"></span>
      <button class="button button-quiet" id="signOut" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <section class="panel" id="rolePanel">
      <h1>Welcome to USFP</h1>
      <p>First login — tell us who you are so we can set up the right camp tools for you.</p>
      <div class="role-grid">
        <button class="role-card" type="button" data-role="scout">
          <i data-lucide="compass"></i>
          <strong>Scout</strong>
          <span>Join camps, track kit and see your patrol’s progress</span>
        </button>
        <button class="role-card" type="button" data-role="parent">
          <i data-lucide="users"></i>
          <strong>Parent</strong>
          <span>Follow your Scout’s camps, forms and fundraising</span>
        </button>
      </div>
    </section>

    <section id="dashView" class="hidden">
      <div class="dash-head">
        <div>
          <h1 id="greeting">Your camps</h1>
          <p id="roleLine"></p>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><strong>0</strong><span>Upcoming camps</span></div>
        <div class="stat"><strong>£0</strong><span>Raised for camp</span></div>
        <div class="stat"><strong>0</strong><span>Forms to complete</span></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    lucide.createIcons();

    const SUPABASE_URL = "https://sqindmcruywdzpvmawtp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_O82tJ5AlfI51jS-xPpnBEg_8I93kNvX";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const rolePanel = document.getElementById("rolePanel");
    const dashView = document.getElementById("dashView");
    const userEmail = document.getElementById("userEmail");
    const greeting = document.getElementById("greeting");
    const roleLine = document.getElementById("roleLine");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 3200);
    }

    function firstName(user) {
      const meta = user.user_metadata || {};
      const name = meta.full_name || meta.name || "";
      return name ? name.split(" ")[0] : user.email.split("@")[0];
    }

    function showApp(user) {
      const role = (user.user_metadata || {}).role;
      userEmail.textContent = user.email;
      greeting.textContent = `Welcome, ${firstName(user)}`;
      roleLine.textContent = role === "parent"
        ? "Parent view — follow your Scout’s camps, forms and fundraising."
        : "Scout view — your camps, kit and patrol progress.";
      rolePanel.classList.add("hidden");
      dashView.classList.remove("hidden");
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const user = session.user;
      if ((user.user_metadata || {}).role) {
        showApp(user);
      }
    }

    document.querySelectorAll(".role-card").forEach((card) => {
      card.addEventListener("click", async () => {
        document.querySelectorAll(".role-card").forEach((c) => { c.style.opacity = "0.6"; });
        const { data, error } = await supabase.auth.updateUser({
          data: { role: card.dataset.role },
        });
        if (error) {
          document.querySelectorAll(".role-card").forEach((c) => { c.style.opacity = ""; });
          showToast(error.message);
          return;
        }
        showApp(data.user);
      });
    });

    document.getElementById("signOut").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    init();
  </script>
</body>
</html>
