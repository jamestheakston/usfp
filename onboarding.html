<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="USFP app — plan overseas Scout camps.">
  <title>App — USFP</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

    :root {
      --ink: #132d2b;
      --ink-soft: #48635e;
      --cream: #f6f7f1;
      --paper: #fffefa;
      --mint: #d7eee1;
      --green: #23845c;
      --green-dark: #176345;
      --line: rgba(19, 45, 43, 0.13);
      --shadow: 0 24px 70px rgba(17, 56, 48, 0.14);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 4%, rgba(167, 220, 224, 0.6), transparent 25rem),
        radial-gradient(circle at -5% 34%, rgba(247, 216, 138, 0.28), transparent 24rem),
        var(--cream);
      font-family: "DM Sans", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .panel {
      width: min(520px, 100%);
      padding: 38px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      color: var(--paper);
      background: var(--ink);
      border-radius: 11px 11px 11px 3px;
    }
    .brand-mark svg { width: 16px; height: 16px; }

    h1 {
      margin: 0 0 8px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      letter-spacing: -0.05em;
      line-height: 1.1;
    }
    .panel > p { margin: 0 0 26px; color: var(--ink-soft); font-size: 14px; }

    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .role-card {
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .role-card:hover { transform: translateY(-3px); border-color: var(--green); background: var(--mint); }
    .role-card svg { width: 30px; height: 30px; color: var(--green-dark); }
    .role-card strong { font-family: "Space Grotesk", sans-serif; font-size: 17px; letter-spacing: -0.03em; }
    .role-card span { color: var(--ink-soft); font-size: 12px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      padding: 13px 17px;
      color: var(--paper);
      background: var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: 180ms ease;
      pointer-events: none;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 480px) {
      .role-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <a class="brand" href="index.html">
      <span class="brand-mark"><i data-lucide="tent"></i></span>
      USFP
    </a>
    <h1>Welcome to USFP</h1>
    <p>Tell us who you are so we can set up the right camp tools for you.</p>
    <div class="role-grid">
      <button class="role-card" type="button" data-role="scout">
        <i data-lucide="compass"></i>
        <strong>Scout</strong>
        <span>Join camps, track kit and see your patrol’s progress</span>
      </button>
      <button class="role-card" type="button" data-role="parent">
        <i data-lucide="users"></i>
        <strong>Parent</strong>
        <span>Follow your Scout’s camps, forms and fundraising</span>
      </button>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    lucide.createIcons();

    const SUPABASE_URL = "https://sqindmcruywdzpvmawtp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_O82tJ5AlfI51jS-xPpnBEg_8I93kNvX";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 3200);
    }

    function accountType(user) {
      const meta = user.user_metadata || {};
      return meta.account_type || meta.role || null;
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      const type = accountType(session.user);
      if (type) window.location.href = `/${type}/app`;
    }

    document.querySelectorAll(".role-card").forEach((card) => {
      card.addEventListener("click", async () => {
        document.querySelectorAll(".role-card").forEach((c) => { c.style.opacity = "0.6"; });
        const { data, error } = await supabaseClient.auth.updateUser({
          data: { account_type: card.dataset.role },
        });
        if (error) {
          document.querySelectorAll(".role-card").forEach((c) => { c.style.opacity = ""; });
          showToast(error.message);
          return;
        }
        window.location.href = `/${card.dataset.role}/app`;
      });
    });

    init();
  </script>
</body>
</html>
